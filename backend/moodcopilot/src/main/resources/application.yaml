server:
  port: 18080
spring:
  mvc:
    async:
      request-timeout: 120000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: moodcopilot
  data:
    # redis配置
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 5
          time-between-eviction-runs: 30s
  #数据库的连接信息
  datasource:
    #    url: jdbc:mysql://localhost:3306/dems
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moodcopilot}?serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 120000
      cache-null-values: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          max-tokens: 2048
    rag:
      embedding:
        api-url: ${RAG_EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
        api-key: ${SILICONFLOW_API_KEY:}
        model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
        dimension: 1024
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:your-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-auth-code}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  jackson:
    time-zone: Asia/Shanghai
jwt:
  secret: ${JWT_SECRET:bW9vZGNvcGlsb3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0yMDI2}
  expiration: 86400000
#Mybatis相关配置
mybatis-plus:
  map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto # 全局设置主键生成策略为数据库自增
