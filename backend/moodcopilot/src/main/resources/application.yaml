server:
  port: 18080
spring:
  profiles:
    include: prompts
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 120000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: moodcopilot
  data:
    # redis配置
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5
          time-between-eviction-runs: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:moodcopilot}
    password: ${RABBITMQ_PASSWORD:moodcopilot}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: ${RABBITMQ_PREFETCH:5}
        retry:
          enabled: false
  #数据库的连接信息
  datasource:
    #    url: jdbc:mysql://localhost:3306/dems
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moodcopilot}?serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 120000
      cache-null-values: false
  ai:
    http-timeout-seconds: ${AI_HTTP_TIMEOUT_SECONDS:90}
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 30000
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          max-tokens: 8192
    rag:
      embedding:
        api-url: ${RAG_EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
        api-key: ${SILICONFLOW_API_KEY:}
        model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
        dimension: 1024
  mail:
    protocol: ${MAIL_PROTOCOL:smtp}
    host: ${MAIL_HOST:smtp.qq.com}
    port: 465
    username: ${MAIL_USERNAME:your-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-auth-code}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          timeout: 15000
          connectiontimeout: 15000
          writetimeout: 15000
  jackson:
    time-zone: Asia/Shanghai
jwt:
  secret: ${JWT_SECRET}
  expiration: 2592000000
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://moodcopilot.dpdns.org,http://localhost:5173,http://localhost:5174}
captcha:
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
    keyPrefix: "captcha:secondary"
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
  bucket: ${OSS_BUCKET:moodcopilot}
  access-key: ${OSS_ACCESS_KEY:}
  secret-key: ${OSS_SECRET_KEY:}
moodcopilot:
  time-zone: ${MOODCOPILOT_TIME_ZONE:Asia/Shanghai}
  rag:
    embedding:
      connect-timeout-ms: ${RAG_EMBEDDING_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${RAG_EMBEDDING_READ_TIMEOUT_MS:15000}
      max-retries: ${RAG_EMBEDDING_MAX_RETRIES:2}
      circuit-failure-threshold: ${RAG_EMBEDDING_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-seconds: ${RAG_EMBEDDING_CIRCUIT_OPEN_SECONDS:30}
      query-cache-max-size: ${RAG_EMBEDDING_QUERY_CACHE_MAX_SIZE:1000}
      query-cache-ttl-seconds: ${RAG_EMBEDDING_QUERY_CACHE_TTL_SECONDS:600}
  vision:
    api-key: ${VISION_API_KEY:}
    api-url: ${VISION_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    model: ${VISION_MODEL:qwen3-vl-flash}
    ocr-model: ${VISION_OCR_MODEL:qwen-vl-ocr-latest}
    ocr-max-tokens: ${VISION_OCR_MAX_TOKENS:2048}
    enable-ocr-for-text-images: ${VISION_ENABLE_OCR:true}
  wechat:
    miniapp:
      app-id: ${WX_APP_ID:}
      app-secret: ${WX_APP_SECRET:}
timeline:
  max-gap-days: ${TIMELINE_MAX_GAP_DAYS:14}
  min-evidence-count: ${TIMELINE_MIN_EVIDENCE_COUNT:3}
  boundary-confidence-threshold: ${TIMELINE_BOUNDARY_CONFIDENCE_THRESHOLD:0.85}
#Mybatis相关配置
mybatis-plus:
  map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto # 全局设置主键生成策略为数据库自增
