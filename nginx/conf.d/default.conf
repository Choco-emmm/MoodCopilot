server {
    listen 80;
    server_name moodcopilot.top www.moodcopilot.top;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # SSE 流式聊天（/runs/{runId}/stream）。必须关缓冲并抬高读超时，
    # 否则整段响应会被 nginx 攒起来一次性下发（等于没流式），
    # 且工具调用的静默期超过默认 60s 会被直接掐断。
    location /api/chat/ {
        proxy_pass http://backend:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name moodcopilot.top www.moodcopilot.top;

    ssl_certificate /etc/nginx/ssl/moodcopilot.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/moodcopilot.top.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # SSE 流式聊天（/runs/{runId}/stream）。必须关缓冲并抬高读超时，
