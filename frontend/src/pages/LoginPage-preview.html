<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodCopilot 登录页预览 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-primary: #4a7c62;
  --color-primary-hover: #326a54;
  --color-primary-light: #eef4f0;
  --color-accent: #a94b45;
  --color-accent-light: #d9827a;
  --color-accent-bg: #fff1ef;
  --color-bg: #f8f6f1;
  --color-surface: #fffdf8;
  --color-surface-hover: #f0ede6;
  --color-text: #20201d;
  --color-text-secondary: #67645d;
  --color-text-muted: #7d7870;
  --color-text-light: #a09c94;
  --color-on-primary: #ffffff;
  --color-border: #d4d8d5;
  --color-border-strong: #aab5ad;
  --font-display: "Noto Serif SC", "STSong", "Songti SC", serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  background: var(--color-bg);
  color: var(--color-text);
}

/* ═══════════════════════════════════
   登录页 — 书封式品牌区
   ═══════════════════════════════════ */

.auth-page {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  min-height: 100vh;
  overflow: hidden;
}

/* ── 左侧品牌区：深底书封 ── */
.auth-brand-side {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0;
  background: #1a1f1c;
  overflow: hidden;
}

/* 深底上的微弱纹理 */
.auth-brand-side::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 30% 70%, rgba(74, 124, 98, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 70% 30%, rgba(169, 75, 69, 0.08) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* 中轴装饰线 */
.brand-spine {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(74, 124, 98, 0.12) 20%,
    rgba(74, 124, 98, 0.12) 80%,
    transparent 100%
  );
  z-index: 1;
  pointer-events: none;
}

/* 品牌区顶部留白 */
.brand-top {
  padding: 48px 56px 0;
  position: relative;
  z-index: 2;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.brand-mark svg {
  width: 18px;
  height: 18px;
  color: var(--color-primary);
}

/* ── 中心内容：大字诗意 ── */
.brand-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 56px;
  position: relative;
  z-index: 2;
}

/* 装饰短横线 */
.brand-rule {
  width: 36px;
  height: 2px;
  background: var(--color-primary);
  border-radius: 1px;
  margin-bottom: 32px;
}

.brand-hero {
  font-family: var(--font-display);
  font-size: clamp(32px, 4.5vw, 48px);
  font-weight: 400;
  color: rgba(255, 255, 255, 0.92);
  line-height: 1.5;
  letter-spacing: 0.04em;
  margin-bottom: 28px;
}

.brand-hero em {
  font-style: normal;
  color: var(--color-primary);
  /* 让 em 在深底上也够亮 */
  color: #6aaa8a;
  font-weight: 600;
}

.brand-sub {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.35);
  line-height: 1.8;
  max-width: 340px;
  font-weight: 300;
  letter-spacing: 0.02em;
}

.brand-sub em {
  font-style: normal;
  color: rgba(255, 255, 255, 0.55);
}

/* ── 品牌区底部 ── */
.brand-bottom {
  padding: 0 56px 48px;
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-bottom-left {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.2);
  letter-spacing: 0.06em;
}

.brand-bottom-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 底部小装饰：5个 mood 色点 */
.mood-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  opacity: 0.6;
}
.mood-dot:nth-child(1) { background: #6aaa8a; }
.mood-dot:nth-child(2) { background: #d9827a; }
.mood-dot:nth-child(3) { background: #c9b06b; }
.mood-dot:nth-child(4) { background: #7aa0b8; }
.mood-dot:nth-child(5) { background: #a08ab8; }

/* ── 右侧表单区 ── */
.auth-form-side {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 44px;
  background: var(--color-surface);
}

.auth-form-card {
  width: 100%;
  max-width: 360px;
}

.auth-form-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 4px;
  letter-spacing: 0.03em;
}

.auth-form-sub {
  font-size: 14px;
  color: var(--color-text-muted);
  margin-bottom: 36px;
}

/* 表单元素 */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.form-input {
  width: 100%;
  height: 46px;
  padding: 0 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg);
  font-size: 15px;
  color: var(--color-text);
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.form-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--color-primary) 10%, transparent);
}

.form-input::placeholder {
  color: var(--color-text-light);
}

/* 隐私声明 */
.privacy-box {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 28px 0;
  padding: 14px 16px;
  background: var(--color-primary-light);
  border-radius: var(--radius-md);
  border: none;
  border-left: 3px solid var(--color-primary);
}

.privacy-icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: var(--color-primary);
  margin-top: 0;
}

.privacy-content {
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.65;
}

.privacy-content strong {
  color: var(--color-text);
  font-weight: 600;
}

.privacy-content ul {
  margin: 4px 0 0;
  padding-left: 15px;
}

.privacy-content li {
  margin-bottom: 3px;
}

/* 同意复选框 */
.form-checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 24px;
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.55;
  cursor: pointer;
}

.form-checkbox input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--color-primary);
  margin-top: 1px;
  flex-shrink: 0;
}

/* 提交按钮 */
.form-submit {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-on-primary);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  letter-spacing: 0.06em;
}

.form-submit:hover {
  background: var(--color-primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px color-mix(in oklab, var(--color-primary) 28%, transparent);
}

.form-submit:active {
  transform: translateY(0);
}

.auth-switch {
  text-align: center;
  margin-top: 28px;
  font-size: 13px;
  color: var(--color-text-muted);
}

.auth-switch a {
  color: var(--color-primary);
  font-weight: 600;
  text-decoration: none;
  transition: color 0.15s;
}

.auth-switch a:hover {
  color: var(--color-primary-hover);
}

/* 验证码占位 */
.captcha-placeholder {
  width: 100%;
  height: 56px;
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  font-size: 13px;
  margin-bottom: 24px;
  background: var(--color-bg);
}

/* ═══════════════════════════════════
   移动端
   ═══════════════════════════════════ */

@media (max-width: 780px) {
  .auth-page {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }

  .auth-brand-side {
    padding: 0;
    min-height: 0;
  }

  .brand-spine { display: none; }

  .brand-top {
    padding: 32px 24px 0;
  }

  .brand-center {
    padding: 20px 24px 28px;
  }

  .brand-rule {
    margin-bottom: 20px;
    width: 28px;
  }

  .brand-hero {
    font-size: 24px;
    margin-bottom: 12px;
  }

  .brand-sub {
    font-size: 13px;
    max-width: none;
  }

  .brand-bottom {
    padding: 0 24px 24px;
  }

  .brand-bottom-left { display: none; }

  .auth-form-side {
    padding: 28px 24px 48px;
    align-items: flex-start;
  }

  .auth-form-card {
    max-width: none;
  }

  .form-input {
    font-size: 16px; /* prevent iOS zoom */
  }
}

@media (max-width: 420px) {
  .brand-top {
    padding: 24px 20px 0;
  }

  .brand-center {
    padding: 16px 20px 24px;
  }

  .brand-hero {
    font-size: 22px;
  }

  .brand-sub {
    font-size: 12px;
  }

  .brand-bottom {
    padding: 0 20px 20px;
  }

  .auth-form-side {
    padding: 24px 20px 40px;
  }

  .auth-form-title {
    font-size: 22px;
  }

  .form-submit {
    height: 46px;
    font-size: 14px;
  }
}
</style>
</head>
<body>

<div class="auth-page">
  <!-- 左侧品牌区 — 书封风格 -->
  <div class="auth-brand-side">
    <div class="brand-spine"></div>

    <div class="brand-top">
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="14" y="11" width="36" height="42" rx="8" stroke="currentColor" stroke-width="4"/>
          <path d="M24 11V53" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 38C26.6 33.8 24 31.1 24 27.5C24 24.95 26 23 28.6 23C30.1 23 31.55 23.68 32.5 24.76C33.45 23.68 34.9 23 36.4 23C39 23 41 24.95 41 27.5C41 31.1 38.4 33.8 33 38L32.5 38.4L32 38Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        MoodCopilot
      </span>
    </div>

    <div class="brand-center">
      <div class="brand-rule"></div>
      <h1 class="brand-hero">写下今天，<br><em>慢慢理解</em>自己。</h1>
      <p class="brand-sub">先帮你看见情绪；<em>当你愿意时</em>，再把你温和地连接给相似心情的人。</p>
    </div>

    <div class="brand-bottom">
      <span class="brand-bottom-left">你的情绪，值得被温柔对待</span>
      <div class="brand-bottom-right">
        <span class="mood-dot"></span>
        <span class="mood-dot"></span>
        <span class="mood-dot"></span>
        <span class="mood-dot"></span>
        <span class="mood-dot"></span>
      </div>
    </div>
  </div>

  <!-- 右侧表单区 -->
  <div class="auth-form-side">
    <div class="auth-form-card">
      <h1 class="auth-form-title">欢迎回来</h1>
      <p class="auth-form-sub">登录你的情绪日记</p>

      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" placeholder="输入邮箱">
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" placeholder="输入密码">
      </div>

      <div class="privacy-box">
        <svg class="privacy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <div class="privacy-content">
          <strong>数据隐私保护声明</strong>
          <ul>
            <li>私密数据仅在您与 AI 间严格流转，开发者绝不窥探或利用。</li>
            <li>仅当您主动设为「分享到社区」时，该文本才会在社区流通。</li>
            <li>仅当您主动开启共鸣匹配时，系统才会提取特征（绝不含私密明文）。</li>
          </ul>
        </div>
      </div>

      <label class="form-checkbox">
        <input type="checkbox">
        <span>我已阅读并同意上述隐私声明；且知晓 AI 分析仅供参考，不构成医疗诊断。</span>
      </label>

      <div class="captcha-placeholder">验证码区域</div>

      <button class="form-submit">登录</button>

      <p class="auth-switch">还没有账号？<a href="#">注册</a></p>
    </div>
  </div>
</div>

</body>
</html>
