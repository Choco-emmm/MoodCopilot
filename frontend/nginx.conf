server {
    listen 80;
    server_name localhost;

    # 图片上传
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # 静态资源缓存（带 hash 的构建产物可永久缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口文件：彻底禁用缓存，防止老用户加载旧 index.html
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # CSP：放行 Cloudflare Turnstile + 网易云封面 + WebSocket/SSE
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; connect-src 'self' ws: wss: http: https:;" always;
    }

    # Service Worker：禁止缓存，确保浏览器始终拉取最新
    location = /sw.js {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # Web App Manifest：禁止缓存，确保 PWA 信息随版本更新
    location = /manifest.json {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # CSP：放行 Cloudflare Turnstile + 网易云封面 + WebSocket/SSE
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; connect-src 'self' ws: wss: http: https:;" always;
    }

    # WebSocket 代理（支持协议升级 + 长连接超时）
    location /ws/ {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天 SSE 专用：禁用缓冲以支持流式推送，延长超时
    location /api/chat/ {
        proxy_pass http://backend:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # 普通 API 反向代理（启用缓冲，减少延迟）
    location /api/ {
        proxy_pass http://backend:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
}
