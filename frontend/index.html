<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
  <script>
    (function() {
      var m = window.matchMedia('(prefers-color-scheme: dark)');
      if (m.matches) document.documentElement.setAttribute('data-theme', 'minimal-dark');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="shortcut icon" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/icon-192.svg" />
  <title>MoodCopilot</title>
  <link rel="stylesheet" href="/tac/css/tac.css">
  <script defer src="/tac/js/tac.js"></script>
</head>

<body>
  <div id="app">
    <div class="initial-loader">
      <div class="loader-pulse"></div>
      <div class="loader-text">MoodCopilot</div>
    </div>
  </div>
  <style>
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #F6F2EA;
      color: #4a7c62;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .initial-loader {
        background-color: #0e0e0e;
        color: #8a8e96;
      }
      .loader-pulse {
        background: #8a8e96;
      }
    }
    .loader-pulse {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #4a7c62;
      animation: initial-pulse 1.5s ease-in-out infinite;
      margin-bottom: 24px;
    }
    .loader-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      opacity: 0.8;
      animation: text-pulse 1.5s ease-in-out infinite;
    }
    @keyframes initial-pulse {
      0% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(0.8); opacity: 0.3; }
    }
    @keyframes text-pulse {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
  </style>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
