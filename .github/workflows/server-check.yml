name: Server connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Check server without deploying
    if: github.ref_name == (vars.DEPLOY_BRANCH || 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check SSH, installation and application health
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          PROJECT_DIR: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS PROJECT_DIR; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "${SSH_KEY//$'\r'/}" > "$ssh_dir/key"
          printf '%s\n' "${SSH_KNOWN_HOSTS//$'\r'/}" > "$ssh_dir/known_hosts"
          printf -v args '%q ' "$PROJECT_DIR"
          cat scripts/check-server.sh | ssh -i "$ssh_dir/key" -p "$SSH_PORT" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "bash -s -- $args" | tee "$ssh_dir/report"
          grep -qx SERVER_CHECK_COMPLETE "$ssh_dir/report"
